name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install libnng
        run: sudo apt-get update && sudo apt-get install -y libnng-dev

      - name: Compile extension
        run: bundle exec rake compile

      - name: Run tests
        run: bundle exec rake test
