name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Build and install libnng with TLS
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libmbedtls-dev
          git clone --branch v1.10.1 --depth 1 https://github.com/nanomsg/nng.git /tmp/nng
          cmake -S /tmp/nng -B /tmp/nng/build -DCMAKE_BUILD_TYPE=Release -DNNG_ENABLE_TLS=ON
          cmake --build /tmp/nng/build --parallel
          sudo cmake --install /tmp/nng/build

      - name: Compile extension
        run: bundle exec rake compile

      - name: Run tests
        run: bundle exec rake test
